# MACAW packaged defaults. Do not edit; override in your project.yaml.
# Every key carries its unit and what changing it affects.

project:
  work_dir: null                     # logs, job records and cache, never results; null = under output_dir
  # How folders under raw_dir name recordings, e.g. "sub-{group_id}/ses-{session_id}"
  recording_pattern: "{group_id}"
  recording_prefix: ""               # directory prefix under raw_dir, e.g. "dyad-". "" = every dir
  recording_config_dir: recordings   # dir of <recording_id>.yaml files overriding this config
  setups_dir: setups                 # dir of <name>.yaml files, each saying what the device folders of a recording hold
  scripts_dir: scripts               # your own .py files: measure functions, extractors, backends
  calibration_dir: calibration       # clips filmed before recording: an object of known length, a board per camera setup
  segments: segments.csv             # table of named parts of recordings (recording, segment, start_s, end_s) to summarise separately
  heights: heights.csv               # table of people's standing heights (recording, person, height) for 3D from one camera
  ratings: ratings.csv               # table of people's scores on the rating scales (recording, segment, scale, coder, score)
  n_subjects: 2                      # people per recording; tested with 2
  roles: [parent, child]             # role labels; length must equal n_subjects
  units: cm                          # cm | m | in, for every length entered or shown
  excluded_recordings: []            # recording ids skipped by every command

align:
  method: gcc_phat                   # gcc_phat | manual | none
  search_window_s: 600.0             # s; max offset searched between two sources, on loudness envelopes
  min_confidence: 0.6                # 0-1; correlation peak sharpness below this counts as blunt
  min_agreement: 0.5                 # 0-1; a blunt peak is flagged when fewer sounding segments than this find the same offset
  drift_check: true                  # detect linear clock drift from segment offsets, and correct it when flagged
  drift_segment_s: 60.0              # s; segment length for the cross-check and the drift regression
  max_drift_ppm: 200.0               # parts per million; the largest drift the segment search allows for
  review: flagged                    # always | flagged: only uncertain offsets | skip

# Each recording folder holds one folder per device, named as here, with that device's file in it.
# The cameras and microphones are written in setups/<name>.yaml, normally from the Setup page.
setup:
  name: main                         # which file in project.setups_dir; a recording can name another in its own file
  cameras: {}                        # name: {body: [roles], face: [roles], gaze: [roles], hears: [roles]}
  microphones: {}                    # name: {hears: [roles]}
  room: {}                           # where things are, in project.units, seen from above with x across and y along the room: {size: [across, along] of the walls from the zero corner, people: {role: {at: [x, y], eyes: h, facing: deg}}, cameras: {name: {at, height, facing, tilt, lens}}, microphones: {name: {at, height}}, things: {name: {at, height, size: [w, d]}}}

identity:
  voice_hints: []                    # shared microphone, with text.voice_review flagged or skip: [{says: <pattern>, role: <role>}], a voice saying it is likely that role
  pitch_order: []                    # shared microphone, with text.voice_review flagged or skip: roles from the lowest voice to the highest, e.g. [mother, child]

segment:
  task_start_s: null                 # s; trims the start. null = from 0
  task_end_s: null                   # s; null = to the end

# Before any video step, each video is re-encoded once: a constant frame rate, upright, square
# pixels, progressive, standard dynamic range, and frame 0 at the first sound of its file. The copies take about as much
# disk as the originals again. Frame rate and picture size stay as recorded unless set here.
video:
  normalise: true                    # false reads the originals as they are, only warning
  fps: null                          # one rate for every video; must divide each file's rate
  quality: 17                        # 0-51; lower keeps more detail. 17 looks like the source
  encoder: libx264                   # libx264 (any machine, same frames everywhere) | h264_nvenc (NVIDIA, faster)

prosody:
  backend: parselmouth               # parselmouth | librosa | builtin
  fallback_chain: [parselmouth, librosa, builtin]   # tried in order when one fails
  frame_step_s: 0.01                 # s; frame-scale sampling period for f0/intensity/HNR
  f0_min_hz: 75.0                    # Hz; too low invites octave halving
  f0_max_hz: 500.0                   # Hz; too high invites octave doubling. Raise for children
  f0_range_by_role: {}               # per-role override, e.g. {child: [100, 600]}
  standard_sets: [eGeMAPSv02]        # eGeMAPSv02 (88 dims) and/or ComParE_2016 (6373 dims)
  min_voiced_fraction: 0.1           # 0-1; a person voiced for less of the task window gets a QC warning

text:
  asr_backend: whisperx              # whisperx | faster_whisper
  asr_model: large-v3                # smaller models are much faster and much worse on children
  language: null                     # ISO code; null = autodetect per recording
  device: auto                       # auto | cuda | cpu; auto uses a GPU when one is seen
  compute_type: float16              # float16 on GPU; use int8 for CPU-only fallback
  diarization: per_track             # per_track: a mic per person | pyannote: one shared mic | none
  diarization_model: pyannote/speaker-diarization-community-1  # HuggingFace pipeline for pyannote; accept its terms first
  extra_voices: 0                    # other voices on a shared mic, e.g. 1 for a researcher
  voice_review: always               # always | flagged: only when the suggestion is unsure | skip
  crosstalk_margin_db: 6.0           # an utterance this much louder on another track is bleed
  word_timestamps: true              # needed for gesture-speech alignment and MLU
  embedding_model: null              # sentence-transformers name; null disables text embeddings
  syntax_model: en_core_web_sm       # spaCy parser for text.syntax; install it with python -m spacy download
  first_use_min_speakers: 2          # first_use_share counts a word once this many speakers have used it
  exclude_words: english_stopwords      # english_stopwords | none | path to a word list, one word per line
  first_use_words: null              # path to a word list; only these words count, e.g. the task's topic words
  word_lists: {}                     # name -> a file of words or phrases, one per line; gives <name>_per_minute, the sentences holding one, e.g. {negative: negative_words.txt}

pose:
  backend: null                      # mediapipe (reports usage to Google) | yolo (offline; AGPL, not bundled)
  model: null                        # backend-specific checkpoint; null = backend default
  device: auto                       # auto | cpu | cuda
  min_confidence: 0.3                # 0-1; keypoints below this become NaN
  input_size: 1280                   # px; side frames are scaled to before detection (yolo); small people need more
  review: flagged                    # always | flagged: only cameras in doubt | skip
  track_repair: true                 # fix body_id swapping mid-recording
  track_repair_max_gap_s: 1.0        # s; longer disappearances start a new track instead
  suggest_names: false               # true: suggest who is who where nobody clicked; doubtful ones wait

kinematics:
  smoothing_s: 0.3                   # s; Savitzky-Golay window for joint speed, acceleration, jerk
  measures: []                       # your own quantities between points on people; see the user guide
  listening: []                      # movement series averaged where another person talks alone (pose.listening), e.g. [upper_body_speed, motion_energy]
  gestures:
    tier: null                       # annotation tier whose segments are gestures, each on its person's tier; null = none measured
    annotator: null                  # whose segments, when several people coded that tier
    still_speed: null                # px/s (m/s with depth); a hand slower than this is still. Needed with a tier
    peak_prominence: null            # px/s; how far a speed peak rises above its surroundings to count as a submovement. Needed with a tier
    still_speed_3d: null             # project.units/s; the same in 3D, with pose3d. Gestures are measured in 3D only when both are set
    peak_prominence_3d: null         # project.units/s
    holds: each_hand                # each_hand: a hold is one hand still | both_hands: both hands still at once, counted once per gesture

scale:                               # right only for people as far from the camera as the object measured
  per_px: null                       # project.units one pixel spans, for everyone; written by hand it wins over any measurement. Per recording in recordings/<id>.yaml
  per_px_by_role: {}                 # role -> project.units per pixel at that person's place, e.g. {child: 0.12}
  calibration: null                  # clip in project.calibration_dir, filmed with the cameras as they stood, for recordings not measured on their own video
  max_size_change: 0.1               # share by which a person's apparent size may change over a recording before the report flags it
  size_window_s: 30                  # s; stretches compared for that change. 30 suits people who stay seated; about 5 when they walk about

pose3d:                              # 3D from two or more cameras that see the same people
  calibration: null                  # in project.calibration_dir: a folder of board clips, one per camera (macaw calibrate-cameras), or a calibration .toml
  units: mm                          # mm | cm | m; an imported calibration's translations, when the file does not say
  board:                             # the ChArUco board printed with macaw calibration-board; these sizes fit A2, for A3 use 50 and 37
    squares_x: 7
    squares_y: 5
    square: null                     # project.units; measure one printed square with a ruler and write it here. Blank is the board as drawn, 7.5 cm squares
    marker: null                     # project.units; blank keeps its share of the square
    dictionary: 5X5_100              # 4X4_50 | 4X4_100 | 5X5_50 | 5X5_100 | 6X6_50 | 6X6_250
  max_reprojection_px: 15            # px; a camera whose view of a point misses the others' by more is left out of that point, and two that miss each other by more place none
  board_every_s: 0.2                 # s; board clips are read at this interval
  one_camera: null                   # multihmr | a runner script in scripts_dir: 3D from each person's own camera by a body model
  one_camera_every: 1                # the body model reads every nth frame
  one_camera_threshold: 0.1          # how sure the body model must be that a person is there; lower finds more, small children especially

face:
  backend: pyfeat                    # pyfeat (most weights non-commercial) | mediapipe (no action units) | openface
  model: null                        # pyfeat: v1 or v2 | mediapipe: path to face_landmarker.task
  device: auto                       # auto | cpu | cuda
  batch_size: 16                     # frames the face model takes at once; 16 of 1080p takes about 8 GB of GPU memory, and a batch the GPU cannot hold may slow to a crawl instead of failing
  action_units: true                 # 20 action units per frame, 0 to 1
  landmarks: true                    # face landmarks kept in an artifact, not the long table; face.movement reads them
  blink_min_eye_px: 5.0              # px; eyes narrower than this in the picture are not read for blinks
  au_above: {}                       # action unit -> value on the face model's scale; face.shares gives the share of face frames above it, e.g. {au12: 0.5}
  gaze: false                        # gaze direction per frame as well (pyfeat: v1 adds L2CS-Net, v2 has it built in)
  check_model: null                  # a second model (v1 or v2) for face.au_check, which only checks AU agreement
  check_backend: null                # face.au_check with another backend, e.g. openface against pyfeat; null = face.backend

gaze:
  backend: gazelle                   # gazelle: from the picture | angles: head angles against the room
  model: null                        # gazelle_dinov2_vit{l,b}14_inout[_childplay]; null = vitl14_inout_childplay
  device: auto                       # auto | cpu | cuda
  batch_size: 16                     # frames the model takes at once
  targets: []                        # things people may look at, in plain words, e.g. [bottle, book]
  object_backend: grounding_dino     # grounding_dino: finds things by name, five times a second (Apache-2.0)
  object_model: null                 # grounding_dino: IDEA-Research/grounding-dino-tiny (default) or another on the Hugging Face hub
  object_score: 0.35                 # 0-1; lower finds more things and more that are not there
  tolerance_deg: null                # deg; backend angles: a look within this of the direction to someone is a look at them; no default, as it depends on how far apart the people sit
  min_look_s: 0.2                    # s; a look shorter than this joins the one before it (the first look, the one after), so a flicker of a frame or two is not counted as a look; 0 keeps every frame as read

motion:
  rois: {}                           # subject_id -> [x, y, w, h] in pixels of their own camera's picture as a player shows it, else of the first shared one; required by motion.mea
  threshold: 10                      # 0-255; per-pixel difference counted as motion
  smoothing_s: 0.0                   # s; moving-average window. 0 = raw

turns:
  max_gap_s: 2.0                     # s; longer silence ends a turn instead of continuing it
  interruption_overlap_s: 0.5        # s; overlap above this is an interruption, below a backchannel
  smooth_transfer_gap_s: 0.2         # s; |gap| under this counts as a fluent transfer
  silence_min_s: 1.0                 # s; joint silence longer than this is logged as a pause
  window_s: null                     # s; entropy over sliding windows as well; null = whole recording only
  window_hop_s: null                 # s; null = half of window_s
  permutation_entropy_order: 3       # embedding order; 3 needs far shorter series than 5

coding:
  layers: [A]                        # A physical facts | B speech acts (LLM) | C constructs
  codebook: null                     # path to the codebook YAML; required for layer B
  backchannel_lexicon: []            # short acknowledgement tokens, language-specific
  backchannel_max_s: 1.0             # s; longer utterances cannot be backchannels
  min_turn_internal_pause_s: 0.2     # s; shorter gaps inside a turn are recogniser segment seams; 0 keeps all
  llm:
    provider: ollama                 # ollama | vllm | llamacpp | openai | anthropic, or a plugin's name
    model: null                      # required for layer B; the name the provider knows it by
    base_url: null                   # null = provider default endpoint
    temperature: 0.3                 # above 0 so repeated samples can disagree
    max_tokens: 8192                 # a cap per answer; a model that reasons first spends tokens on that before the codes
    timeout_s: 300                   # s; one request
    n_samples: 5                     # answers per unit; the label is the majority, confidence its share
    seed: 0                          # sample i sends seed + i where the provider takes one
    allow_abstain: true              # the model may answer "cannot tell"
    review_threshold: 0.7            # 0-1; below this the unit enters the human review queue
    review_random: 5                 # sure units drawn at random into the review queue; 0 = none
    batch_size: 20                   # units per request
    context_units: 5                 # earlier lines shown before each batch, not coded
    coded_roles: []                  # roles whose lines are coded, the rest is context; [] = all
    show: [timing]                   # timing | pitch | loudness | rate | frames, besides the words; [] = words only
    notes: ""                        # your own words to the model, e.g. "A is the mother"
    examples: null                   # a table of coded units shown as examples (macaw draw-examples)
    reasons: false                   # true: the model says what each code rests on
    think: null                      # null = the model's default; false answers at once (local servers)
  judges: {}                         # more codings by the language model beside this one, to compare, e.g. {k0: {codebook: names_only.yaml}, words_only: {show: []}}; each takes codebook and any coding.llm key, the rest as above
  ratings: {}                        # whole recordings rated on scales by the language model, one version per name, e.g. {full_text: {scales: scales.yaml, show: []}}; each takes scales, transcript (in_use | recognised), segments and the coding.llm keys provider, model, base_url, temperature, max_tokens, n_samples, seed, show, notes, reasons, think
  imports: {}                        # for macaw import-codes: each tier of your coding files, as the file names it, and whose it is, e.g. {"Child Gaze": {person: child, tier: gaze_target, labels: {Mom: parent, Away: elsewhere}}}; tier and labels are optional

qc:
  checks:
    - transcript_match
    - mouth_match
    - track_quality
    - octave_error
    - motion_energy
    - au_agreement
    - scale
    - gaze_labels
  fail_fast: false                   # true aborts the run on the first failed check
  f0_median_max_by_role: {}          # Hz; a median above it flags a track an octave high throughout, e.g. {mother: 330}
  report_downsample_px: 2000         # px; min-max downsampling target for report curves
  overview_features: []              # features in the report's overview figure; [] = movement, distance, kinematics.measures
  review_max_candidates: 40          # frames the checks pointed at, spread across reasons
  review_baseline: 25                # frames drawn uniformly at random; never filtered by any check
  review_seed: 0                     # fixes the random baseline so a rerun shows the same frames
  look:                              # macaw qc --look: a model that reads pictures looks at the review frames
    provider: ollama                 # the server, as coding.llm.provider; a cloud one receives the frames
    model: null                      # a model that reads pictures, e.g. qwen3-vl:8b-instruct; null = none
    base_url: null                   # null = the provider's usual address
    timeout_s: 300
    people: {}                       # what each role looks like, e.g. {parent: an adult, child: a young child}
    random_check: 5                  # passed frames per recording drawn for a person to check

# Cluster resources are not configured here. They describe the machine rather than the
# study, so they live in a separate hpc.yaml that never enters the config hash.
execution:
  n_workers: 4                       # tasks run side by side; on a cluster, within one recording
  cache: true                        # content-addressed cache for resumable runs
  cache_dir: null                    # null = <output_dir>/.cache
  check_outputs: true                # validate declared outputs after a task reports success
  output_rules: null                 # path to results_check.yaml; null = packaged rules
  job_name_prefix: macaw             # prefix for cluster job names

gui:
  mode: window                       # window (pywebview) | browser | server
  host: 127.0.0.1                    # set to 0.0.0.0 only with mode: server
  port: 8050

# What `macaw run` runs when no -e is given. Entries are extractor names or names from groups;
# dependencies are pulled in automatically, so listing the last step of a chain is enough.
pipeline:
  run: []                            # empty = every installed extractor
  groups: {}                         # your own grouping, e.g. {vocal: [prosody.frame, text.asr]}

plugins: {}                          # extractor name -> its parameters, for extractors from other packages

primary: []                          # feature names registered as primary, purely for bookkeeping
